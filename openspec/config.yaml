schema: spec-driven

context: |
  Proyecto: Recuerda+ (app móvil para recordar tareas y exámenes con anticipación).
  Usuarios: Estudiantes jóvenes (escolares y universitarios) con fechas académicas dispersas.
  Problema que resuelve: Desorganización, olvidos y estrés por falta de planificación oportuna de entregas.
  Tecnologías del equipo: Web móvil/PWA responsive (HTML5, CSS3, JavaScript Vanilla), LocalStorage y Web Notifications API.
  Alcance incluido en MVP:
  - Registro e inicio de sesión con correo y contraseña cifrada (RF01, RF02).
  - Gestión completa (CRUD) de tareas y exámenes con materia, fecha y hora (RF03, RF08).
  - Lista cronológica priorizada (vencidos, hoy y mañana) y filtros por tipo (RF04, RF10).
  - Calendario mensual en cuadrícula con visualización y detalle de entregas (RF07).
  - Estados de avance: pendiente, en progreso y hecho (RF05).
  - Avisos anticipados configurables (1, 3, 24 o 48 h; por defecto 24 h) y centro de avisos (RF06, RF09, RF11).
  - Formulario de reporte de fallos y sugerencias (RF12).
  Fuera de alcance MVP:
  - Integración con plataformas académicas (RF16), chat entre estudiantes (RF17) y gamificación (RF18).

rules:
  specs:
    - "Redactar todos los requisitos y descripciones en español sencillo, directo y comprensible para estudiantes."
    - "Cada requisito funcional debe incluir al menos un escenario de aceptación verificable en formato WHEN/THEN."
    - "Nada fuera del alcance del MVP: excluir integraciones con plataformas académicas, chat entre estudiantes y gamificación."
    - "Los estados de avance de un pendiente se limitan estrictamente a: 'pendiente', 'en progreso' y 'hecho'."
    - "El cálculo del aviso debe ser determinista: fecha límite menos horas de anticipación configuradas (1, 3, 24 o 48 h)."
